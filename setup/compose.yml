# sloper's backend stack: the repo controller.
#
# `make docker` builds the image (setup/Dockerfile) and starts this service.
# Repos are then attached through the controller — the console's "New repo"
# button, or POST /api/repos — and the controller starts one container per
# attached repo from the same image (SLOPER_IMAGE), publishing each repo's
# dashboard API on a host port of its own.
services:
  controller:
    build:
      dockerfile: Dockerfile
    # The image repo containers run as well, so the controller needs no second
    # image.
    image: sloper-agent:latest
    entrypoint: ["/usr/local/bin/sloper-controller"]
    env_file:
      - .env
    environment:
      # The controller drives the host daemon through the mounted socket.
      - SLOPER_CONTROLLER_ADDR=0.0.0.0
      - SLOPER_CONTROLLER_PORT=9090
      - SLOPER_IMAGE=sloper-agent:latest
      # Host address and hostname repo instances are published on/at. Change
      # these when the console runs on another machine.
      - SLOPER_PUBLISH_ADDR=${SLOPER_PUBLISH_ADDR:-127.0.0.1}
      - SLOPER_PUBLIC_HOST=${SLOPER_PUBLIC_HOST:-localhost}
      - SLOPER_PORT_RANGE=${SLOPER_PORT_RANGE:-8080-8180}
      # Binding 0.0.0.0 makes the token mandatory (the controller refuses to
      # serve an unauthenticated API off loopback), so fail at config time
      # rather than at startup.
      - SLOPER_CONTROLLER_TOKEN=${SLOPER_CONTROLLER_TOKEN:?set SLOPER_CONTROLLER_TOKEN in setup/.env}
    ports:
      - "${SLOPER_CONTROLLER_PORT:-9090}:9090"
    volumes:
      # The docker socket is how the controller starts repo containers; the
      # volume keeps its repo registry (controller.sqlite) across restarts.
      - /var/run/docker.sock:/var/run/docker.sock
      - controller_data:/root/.sloper
    restart: unless-stopped

  # Optional: public ingress via Cloudflare Tunnel (token from
  # Zero Trust -> Networks -> Tunnels). Only starts with:
  #   CLOUDFLARED_TOKEN=... sudo docker compose --profile tunnel up
  # Hostnames are configured in the Cloudflare dashboard for token tunnels.
  # This publishes the controller API, which is why SLOPER_CONTROLLER_TOKEN
  # must be set before using the profile.
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    depends_on:
      - controller
    command: ["tunnel", "--no-autoupdate", "run", "--token", "${CLOUDFLARED_TOKEN:-}"]
    restart: unless-stopped

volumes:
  controller_data:
