services:
  looper-service:
    build:
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "${SLOPER_WEB_PORT:-8080}:8080"
    environment:
      - SLOPER_WEB_PORT=8080
      - SLOPER_WEB_ADDR=0.0.0.0
      # pi session transcripts served by the console; inside the sloper_data volume
      - SLOPER_SESSION_DIR=/root/.sloper/sessions
    volumes:
      - sloper_data:/root/.sloper
      - sloper_repo:/root/repo

volumes:
  sloper_data:
  sloper_repo:
